<template data-view="landing">
    <main class="landing-site">
        <header class="public-nav">
            <a class="brand-lockup" href="#inicio" aria-label="Metalúrgica San Jorge, inicio">
                <span class="brand-emblem">SJ</span>
                <span class="brand-mark">METALÚRGICA<strong>SAN JORGE</strong></span>
            </a>
            <div class="public-menu" id="publicMenu">
                <nav aria-label="Navegación principal">
                    <a href="#planta">Instalaciones</a>
                    <a href="#servicios">Servicios</a>
                    <a href="#como-funciona">Cómo funciona</a>
                    <a href="#productos">Productos</a>
                    <a href="#empresa">Empresa</a>
                    <a href="#contacto">Contacto</a>
                </nav>
                <div class="public-menu-actions">{{menuActions}}</div>
            </div>
            <div class="public-controls">
                <div class="public-actions">{{publicActions}}</div>
                <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-controls="publicMenu" aria-expanded="false" data-menu-toggle>
                    <span></span><span></span><span></span>
                </button>
            </div>
        </header>
        <section class="public-hero" id="inicio">
            <div class="hero-content">
                <span class="eyebrow">Fabricación · Mecanizado · Producción</span>
                <h1>Metalúrgica San Jorge<br><span>Fabricación industrial.</span></h1>
                <p>Fabricación y mecanizado de piezas, mantenimiento industrial y seguimiento de cada trabajo desde el pedido hasta la entrega.</p>
                <div class="hero-actions">
                    <a class="btn primary" href="#contacto">Solicitar asesoramiento <span aria-hidden="true">&rarr;</span></a>
                    {{heroAccess}}
                </div>
                <div class="hero-index"><span>01</span><i></i> INDUSTRIA EN MOVIMIENTO</div>
            </div>
            <div class="hero-side-note" aria-hidden="true"><span>MSJ</span><i></i> INDUSTRIA EN MOVIMIENTO</div>
        </section>
        <section class="public-band gallery-band" id="planta">
            <div class="section-heading"><span class="eyebrow">Instalaciones y procesos</span><h2>Experiencia aplicada a cada proyecto.</h2></div>
            <div class="gallery-grid">
                <figure class="gallery-card gallery-card-featured">
                    <img src="https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=1400&q=85" alt="Operario realizando trabajos de soldadura en un taller" loading="lazy" decoding="async">
                    <figcaption><span>01 / FABRICACIÓN</span><strong>Precisión desde el taller</strong></figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&w=1100&q=85" alt="Maquinaria instalada en una planta industrial" loading="lazy" decoding="async">
                    <figcaption><span>02 / PRODUCCIÓN</span><strong>Equipos en acción</strong></figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?auto=format&fit=crop&w=1100&q=85" alt="Plano digital de un proceso de fabricación" loading="lazy" decoding="async">
                    <figcaption><span>03 / PROCESOS</span><strong>Una operación conectada</strong></figcaption>
                </figure>
            </div>
        </section>
        <section class="public-band services-band" id="servicios">
            <div class="section-heading"><span class="eyebrow">Servicios industriales</span><h2>Soluciones para acompañar la producción.</h2></div>
            <div class="service-grid">
                <article><span class="service-number">01 / FABRICACIÓN</span><strong>Mecanizado y fabricación.</strong><span>Piezas y trabajos metalúrgicos desarrollados según los requerimientos de cada proyecto.</span></article>
                <article><span class="service-number">02 / MANTENIMIENTO</span><strong>Continuidad operativa.</strong><span>Atención de necesidades de mantenimiento para acompañar el trabajo diario de planta.</span></article>
                <article><span class="service-number">03 / COORDINACIÓN</span><strong>Gestión industrial.</strong><span>Información de pedidos organizada entre las áreas de la empresa.</span></article>
            </div>
        </section>
        <section class="public-band workflow-band" id="como-funciona">
            <div class="workflow-lead">
                <div class="section-heading">
                    <span class="eyebrow">Cómo funciona</span>
                    <h2>De la consulta al seguimiento.</h2>
                    <p>Un recorrido simple para solicitar un trabajo y mantenerte al tanto.</p>
                </div>
                <figure class="workflow-visual">
                    <img src="https://images.unsplash.com/photo-1727504172739-67b1dbf7e3ee?auto=format&fit=crop&w=1800&q=82" alt="Operario trabajando con una máquina en un taller industrial" loading="lazy" decoding="async">
                    <figcaption><span>PRODUCCIÓN</span><strong>Trabajo metalúrgico en taller</strong></figcaption>
                </figure>
            </div>
            <ol class="workflow-grid">
                <li class="workflow-card">
                    <span class="workflow-step">01</span>
                    <h3>Explorá</h3>
                    <p>Conocé los materiales, insumos y servicios de la empresa.</p>
                    <a href="#productos">Ver productos <span aria-hidden="true">→</span></a>
                </li>
                <li class="workflow-card">
                    <span class="workflow-step">02</span>
                    <h3>Consultá</h3>
                    <p>Escribí a Administración y compartí los detalles de tu proyecto.</p>
                    <a href="#contacto">Iniciar consulta <span aria-hidden="true">→</span></a>
                </li>
                <li class="workflow-card">
                    <span class="workflow-step">03</span>
                    <h3>Seguí el avance</h3>
                    <p>Consultá los mensajes y las novedades de tu pedido desde tu cuenta.</p>
                    <span class="workflow-note">Mensajes y estado en un mismo lugar</span>
                </li>
            </ol>
        </section>
        <section class="public-band products-band" id="productos">
            <div class="products-intro">
                <div class="section-heading">
                    <span class="eyebrow">Materiales y fabricación</span>
                    <h2>Materiales para uso industrial.</h2>
                    <p>Una guía de líneas para consultar. La disponibilidad y las especificaciones se confirman para cada pedido.</p>
                </div>
                <span class="products-stamp"><b>SJ</b><small>CATÁLOGO<br>ORIENTATIVO</small></span>
            </div>
            <div class="product-grid">
                <article class="product-card product-card-featured">
                    <div class="product-card-media">
                        <img src="https://images.unsplash.com/photo-1664565262236-65166affe34a?auto=format&fit=crop&w=900&q=82" alt="Formación rocosa de una mina de hierro" loading="lazy" decoding="async">
                        <span class="product-number">01 / MINERALES</span>
                    </div>
                    <h3>Minerales y ferroaleaciones</h3>
                    <p>Materias primas para procesos metalúrgicos.</p>
                    <ul class="product-list"><li>Mineral de hierro</li><li>Ferroaleaciones</li></ul>
                </article>
                <article class="product-card">
                    <div class="product-card-media">
                        <img src="https://images.unsplash.com/photo-1763926062529-1edf8664c366?auto=format&fit=crop&w=900&q=82" alt="Barras de acero apiladas en un depósito industrial" loading="lazy" decoding="async">
                        <span class="product-number">02 / METALES</span>
                    </div>
                    <h3>Metales industriales</h3>
                    <p>Opciones para trabajos de fabricación y mantenimiento.</p>
                    <ul class="product-list"><li>Hierro y acero</li><li>Aluminio, cobre y bronce</li></ul>
                </article>
                <article class="product-card">
                    <div class="product-card-media">
                        <img src="https://images.unsplash.com/photo-1720036236632-fdb6211cf317?auto=format&fit=crop&w=900&q=82" alt="Tubos metálicos organizados en un almacén" loading="lazy" decoding="async">
                        <span class="product-number">03 / FORMATOS</span>
                    </div>
                    <h3>Perfiles y semielaborados</h3>
                    <p>Presentaciones y medidas para distintas aplicaciones.</p>
                    <ul class="product-list"><li>Chapas y barras</li><li>Perfiles y tubos</li></ul>
                </article>
            </div>
            <div class="products-footer">
                <p><span aria-hidden="true">i</span> Especificaciones y disponibilidad a confirmar según cantidad y aplicación.</p>
                <a class="products-cta" href="#contacto">Consultar por un producto <span aria-hidden="true">→</span></a>
            </div>
        </section>
        <section class="public-band company-band split" id="empresa">
            <div class="company-copy">
                <span class="eyebrow">Una operación conectada</span>
                <h2>Del pedido a la entrega.<br><span>Cada etapa en seguimiento.</span></h2>
                <p>MetalGest conecta administración, producción y calidad para que cada equipo trabaje con información actualizada sobre el avance de las órdenes.</p>
                {{companyAccess}}
            </div>
            <div class="process-panel">
                <span class="process-label">ÁREAS CONECTADAS</span>
                <div class="company-areas">
                    <div><b>01</b><span><strong>Administración</strong><small>Pedidos y atención comercial</small></span></div>
                    <div><b>02</b><span><strong>Producción</strong><small>Fabricación y avances</small></span></div>
                    <div><b>03</b><span><strong>Calidad</strong><small>Controles del trabajo</small></span></div>
                </div>
            </div>
        </section>
        <section class="contact-band" id="contacto">
            <div><span class="eyebrow">Atención comercial</span><h2>Cuéntenos sobre su proyecto.</h2><p>Iniciá sesión para abrir una consulta y mantener el seguimiento desde el chat.</p></div>
            <div class="contact-actions">
                <button class="btn primary" data-consultation>Iniciar consulta <span aria-hidden="true">&rarr;</span></button>
                {{contactAccess}}
            </div>
        </section>
        <footer class="public-footer">
            <a class="brand-lockup" href="#inicio"><span class="brand-emblem">SJ</span><span class="brand-mark">METALÚRGICA<strong>SAN JORGE</strong></span></a>
            <span>MetalGest · Gestión industrial</span>
        </footer>
    </main>
    <button class="landing-chat-bubble" type="button" data-floating-chat aria-label="Abrir chat de atención comercial">
        <span class="landing-chat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" focusable="false">
                <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6.5a7.5 7.5 0 1 1 17-3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></path>
            </svg>
        </span>
        <span class="landing-chat-copy"><strong>¿Necesitás ayuda?</strong><small>Chateá con nosotros</small></span>
        <span class="landing-chat-online" aria-label="Atención disponible"></span>
    </button>
    <div class="auth-modal hidden" id="authModal">
        <div class="auth-shell" role="dialog" aria-modal="true" aria-label="Acceso a MetalGest">
            <aside class="auth-visual">
                <a class="brand-lockup" href="#inicio" aria-label="Metalúrgica San Jorge, inicio">
                    <span class="brand-emblem">SJ</span>
                    <span class="brand-mark">METALÚRGICA<strong>SAN JORGE</strong></span>
                </a>
                <div class="auth-visual-copy">
                    <span class="auth-kicker">PORTAL OPERATIVO</span>
                    <h1>La producción,<br><span>bajo control.</span></h1>
                    <p>Pedidos, órdenes de trabajo y seguimiento operativo en un mismo espacio.</p>
                    <div class="auth-steps" aria-label="Funciones del portal">
                        <span><b>01</b> Acceso a órdenes de trabajo</span>
                        <span><b>02</b> Seguimiento de producción</span>
                        <span><b>03</b> Coordinación entre áreas</span>
                    </div>
                </div>
                <div class="auth-visual-meta"><span>GESTIÓN INDUSTRIAL</span><span>METALGEST</span></div>
            </aside>
            <section class="auth-main">
                <button class="close-btn" data-close type="button" aria-label="Cerrar acceso">×</button>
                <div class="auth-content-wrap">
                    <div class="auth-main-heading">
                        <span>PORTAL SAN JORGE</span>
                        <span class="auth-status"><i></i> ACCESO SEGURO</span>
                    </div>
                    <div class="tabs" role="tablist" aria-label="Tipo de acceso">
                        <button class="tab active" data-tab="login" type="button" role="tab" aria-selected="true" aria-controls="authContent">Ingresar</button>
                        <button class="tab" data-tab="register" type="button" role="tab" aria-selected="false" aria-controls="authContent" tabindex="-1">Registrarse</button>
                    </div>
                    <div id="authContent"></div>
                </div>
            </section>
        </div>
    </div>
</template>
<template data-view="login">
    <h2>Iniciar sesión</h2>
    <p class="muted">Ingresá con tu usuario o correo electrónico y contraseña.</p>
    <form id="loginForm" class="form-grid">
        <label class="field full">Usuario o correo electrónico<input name="identificador" autocomplete="username" required></label>
        <label class="field full">Contraseña<input name="contrasena" type="password" autocomplete="current-password" required></label>
        <button class="btn primary field full" type="submit">Ingresar</button>
    </form>
    <button class="text-link" type="button" data-client-forgot>¿Necesitás recuperar la contraseña de una cuenta con correo?</button>
    <div class="message"></div>
</template>
<template data-view="password-request">
    <h2>Recuperar contraseña</h2>
    <p class="muted">En el correo podés tocar “Crear contraseña nueva” para abrir el formulario, o usar el código de seis dígitos para cambiarla acá.</p>
    <form id="clientPasswordRequestForm" class="form-grid">
        <label class="field full">Correo<input name="email" type="email" autocomplete="email" required></label>
        <button class="btn primary field full">Enviar código</button>
    </form>
    <button class="text-link" type="button" data-client-login-back>Volver al inicio de sesión</button>
    <div class="message"></div>
</template>
<template data-view="password-link">
    <h2>Crear contraseña nueva</h2>
    <p class="muted">Ingresá el código recibido por correo y elegí tu nueva contraseña. El enlace y el código vencen en 10 minutos.</p>
    <form id="clientPasswordLinkForm" class="form-grid">
        <label class="field full">Código de seis dígitos<input name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
        <label class="field full">Contraseña nueva<input name="contrasena" type="password" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}" title="Mínimo 8 caracteres, una mayúscula, una minúscula y un número" autocomplete="new-password" required></label>
        <label class="field full">Repetir contraseña<input name="confirmar" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="btn primary field full">Guardar contraseña</button>
    </form>
    <div class="message"></div>
</template>
<template data-view="password-reset">
    <h2>Cambiar contraseña</h2>
    <p class="muted">Ingresá el código recibido por correo y elegí una contraseña nueva. Si no llega, confirmá que escribiste exactamente el correo con que registraste la cuenta y revisá Spam y Promociones. Podés solicitar otro código si venció.</p>
    <form id="clientPasswordResetForm" class="form-grid">
        <label class="field full">Correo<input name="email" type="email" value="{{email}}" readonly required></label>
        <label class="field full">Código de seis dígitos<input name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
        <label class="field full">Contraseña nueva<input name="contrasena" type="password" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}" title="Mínimo 8 caracteres, una mayúscula, una minúscula y un número" autocomplete="new-password" required></label>
        <label class="field full">Repetir contraseña<input name="confirmar" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="btn primary field full">Guardar contraseña</button>
    </form>
    <button class="text-link" type="button" data-resend-code data-purpose="recuperar">Reenviar código</button>
    <div class="message">{{message}}</div>
</template>
<template data-view="register">
    <h2>Registrar cliente</h2>
    <p class="muted">Completá los datos de la empresa.</p>
    <form id="registerForm" class="form-grid">
        <label class="field full">Empresa<input name="razon_social" maxlength="100" required></label>
        <label>CUIT<input name="cuit"></label>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label class="field full">Direccion<input name="direccion"></label>
        <label class="field full">Contraseña<input name="contrasena" type="password" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}" title="Mínimo 8 caracteres, una mayúscula, una minúscula y un número" autocomplete="new-password" required></label>
        <label class="field full">Repetir contraseña<input name="confirmar" type="password" minlength="8" autocomplete="new-password" required></label>
        <p class="muted field full">La contraseña debe tener 8 caracteres como mínimo, una mayúscula, una minúscula y un número. Después del registro, podés ingresar con tu correo y contraseña.</p>
        <button class="btn primary field full">Registrar cliente</button>
    </form>
    <div class="message"></div>
</template>
<template data-view="verification">
    <h2>Verificar correo</h2>
    <p class="muted">Ingresá el código de seis dígitos que enviamos a tu correo.</p>
    <form id="clientVerificationForm" class="form-grid">
        <label class="field full">Correo<input name="email" type="email" value="{{email}}" readonly required></label>
        <label class="field full">Código<input name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
        <button class="btn primary field full" type="submit">Verificar correo</button>
    </form>
    <button class="text-link" type="button" data-resend-code data-purpose="registro">Reenviar código</button>
    <div class="message">{{message}}</div>
</template>
<template data-view="client-account-dialog">
    <dialog class="client-account-dialog" aria-labelledby="clientAccountTitle">
        <h2 id="clientAccountTitle">{{actionTitle}}</h2>
        <p>{{actionDescription}}</p>
        <form data-client-account-confirm>
            <label class="field">Contraseña de la cuenta<input name="contrasena" type="password" autocomplete="current-password" required></label>
            <div class="client-account-dialog-actions">
                <button class="btn" type="button" data-account-cancel>Cancelar</button>
                <button class="btn {{buttonClass}}" type="submit">{{submitLabel}}</button>
            </div>
            <div class="message" aria-live="polite"></div>
        </form>
    </dialog>
</template>

<template data-view="chat-error">
    <section class="section-panel"><div class="message">{{error}}</div></section>
</template>
<template data-view="chat">
    <section class="chat-layout {{layoutClass}}">
        <aside class="chat-list">
            <div class="chat-list-head">
                <div class="chat-brand">
                    <span class="chat-brand-mark">SJ</span>
                    <span><small>{{chatBrandSubtitle}}</small><strong>{{chatBrandTitle}}</strong></span>
                </div>
                {{newChatButton}}
            </div>
            <div class="chat-list-label"><span>{{conversationLabel}}</span><span>{{chatCount}}</span></div>
            {{chatSearch}}
            <div class="chat-items">{{chatItems}}</div>
            <div class="chat-list-footer"><span class="chat-live-dot"></span><span>Atención de Metalúrgica San Jorge</span></div>
        </aside>
        <section class="chat-window">
            <header class="chat-toolbar">
                <button class="chat-menu-toggle" type="button" data-chat-menu aria-label="Abrir conversaciones" aria-expanded="false" title="Conversaciones">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
                {{clientSiteButton}}
                <span class="chat-avatar chat-toolbar-avatar">{{contactInitials}}</span>
                <span class="chat-toolbar-copy">
                    <strong>{{contactName}}</strong>
                    <small>{{contactSubtitle}}</small>
                </span>
                <span class="chat-status"><i></i>{{chatStatus}}</span>
                {{orderControls}}
            </header>
            {{orderDialog}}
            <div class="chat-thread" id="chatThread"></div>
            <form id="chatForm" class="chat-compose">
                {{subjectField}}
                <textarea id="chatMessage" name="mensaje" aria-label="{{messageLabel}}" placeholder="{{messagePlaceholder}}" rows="1" autocomplete="off" {{message_disabled}}></textarea>
                <div class="chat-attachments" data-chat-attachments hidden aria-live="polite"></div>
                <div class="chat-compose-footer">
                    <div class="chat-compose-tools">
                        <input class="chat-file-input" id="chatFiles" name="adjuntos[]" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.dxf,.dwg,application/pdf,image/jpeg,image/png,image/webp" {{message_disabled}}>
                        <label class="chat-attach-button" for="chatFiles" aria-label="Adjuntar planos o archivos" title="Adjuntar PDF, imágenes, DXF o DWG">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                                <path d="m8.5 12.5 6.9-6.9a3 3 0 0 1 4.2 4.2l-8.8 8.8a5 5 0 0 1-7.1-7.1l8.5-8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                            <span>Adjuntar plano</span>
                        </label>
                        <span class="chat-file-help">PDF · JPG · PNG · DXF · DWG · máx. 10 MB</span>
                        <span class="chat-compose-hint">{{composeHint}}</span>
                    </div>
                    <button class="chat-send-button" type="submit" aria-label="Enviar mensaje" title="Enviar mensaje" {{send_disabled}}><span class="chat-send-icon" aria-hidden="true">↑</span></button>
                </div>
            </form>
            <div class="message"></div>
        </section>
    </section>
</template>
<template data-view="chat-welcome-client">
    <div class="chat-welcome">
        <h3>Iniciá una consulta</h3>
        <p>Escribí tu mensaje abajo. El equipo de Metalúrgica San Jorge te responderá por este chat.</p>
    </div>
</template>
<template data-view="chat-welcome-staff">
    <div class="chat-welcome chat-welcome-empty">
        <h3>Seleccioná una conversación</h3>
        <p>El historial y las respuestas aparecerán acá.</p>
    </div>
</template>
<template data-view="chat-empty-list">
    <div class="chat-list-empty">
        <strong>Sin conversaciones</strong>
        <span>Cuando inicies una consulta, aparecerá acá.</span>
    </div>
</template>
<template data-view="chat-item">
    <button class="chat-item {{activeClass}}" data-chat="{{chatId}}" data-chat-search-text="{{searchText}}">
        <span class="chat-avatar">{{initials}}</span>
        <span class="chat-item-copy">
            <span class="chat-item-title">{{title}}</span>
            <span class="chat-item-preview">{{preview}}</span>
            <span class="chat-item-meta">{{metadata}}</span>
        </span>
        <span class="chat-item-state {{stateClass}}" title="{{state}}"></span>
    </button>
</template>
<template data-view="chat-message">
    <div class="bubble-row {{messageSide}}">
        <div class="bubble">
            <span>{{messageText}}</span>
            {{attachments}}
            <small>{{author}} · {{date}}</small>
        </div>
    </div>
</template>

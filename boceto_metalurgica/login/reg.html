<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style/style.css">
</head>

<body >
    <header class="hder">
            <nav class="bar-log">
                <a href="../login/log.html">Logearse</a>
                <a href="../login/reg.html">Registrarse</a>
            </nav>
        <p class="logo">METALGEST</p> 
        <nav class="bar">
            <a href="../main/index.html">Inicio</a>
            <a href="../main/services.html">Servicios Industriales</a>
            <a href="../main/maquinaria.html">Maquinaria</a>
            <a href="../main/contact.html">Contacto</a>
        </nav>
    </header>

    <main class="bodyl">
    <div class="form-container">
        <h2>Crear Cuenta</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
            </div>
            
            <div class="form-group">
                <label for="apellido">Apellido *</label>
                <input type="text" id="apellido" name="apellido" required placeholder="Tu apellido">
            </div>
            
            <div class="form-group">
                <label for="email">Correo Electrónico *</label>
                <input type="email" id="email" name="email" required placeholder="ejemplo@gmail.com">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña *</label>
                <!-- pattern: al menos 1 mayúscula (?=.*[A-Z]), al menos 1 carácter especial (?=.*[\W_]), mínimo 8 caracteres (.{8,}) -->
                <input type="password" id="password" name="password" required 
                       pattern="(?=.*[A-Z])(?=.*[\W_]).{8,}" 
                       title="Debe contener al menos 8 caracteres, 1 mayúscula y 1 carácter especial."
                       placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label>Tipo de Cuenta (Opcional)</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="tipo_cuenta" value="empresa"> Empresa
                    </label>
                    <label>
                        <input type="radio" name="tipo_cuenta" value="cliente"> Cliente
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="nota">Nota adicional (Opcional)</label>
                <textarea id="nota" name="nota" placeholder="Comentarios adicionales..."></textarea>
            </div>
            
            <button type="submit" class="btn-submit">Registrarse</button>
        </form>
        <div class="links">
            <p>¿Ya tienes una cuenta? <a href="log.html">Inicia Sesión</a></p>
        </div>
    </div>
</main>

</body>
</html>
